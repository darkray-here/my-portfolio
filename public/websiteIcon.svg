<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Mohammed Amaan Khan - Game Developer">
  <defs>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#6d28d9" />
    </linearGradient>
  </defs>

  <!-- Dark rounded tile matching the site background -->
  <rect width="64" height="64" rx="14" fill="#09090d" />

  <!-- Gamepad body -->
  <rect x="6" y="19" width="52" height="28" rx="14" fill="url(#pad)" />

  <!-- D-pad -->
  <rect x="19.5" y="26.5" width="5" height="13" rx="1.5" fill="#09090d" />
  <rect x="15.5" y="30.5" width="13" height="5" rx="1.5" fill="#09090d" />

  <!-- Action buttons -->
  <circle cx="42" cy="29" r="2.8" fill="#09090d" />
  <circle cx="47" cy="34" r="2.8" fill="#09090d" />
</svg>