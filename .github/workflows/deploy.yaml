name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Oracle VPS
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/portfolio_deploy
          chmod 600 ~/.ssh/portfolio_deploy

          ssh-keygen -y -f ~/.ssh/portfolio_deploy > /dev/null

          ssh-keyscan -H 80.225.213.78 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh \
            -i ~/.ssh/portfolio_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ubuntu@80.225.213.78 \
            "cd /opt/homelab/portfolio && \
             git fetch origin main && \
             git reset --hard origin/main && \
             docker run --rm \
               -v /opt/homelab/portfolio:/app \
               -w /app \
               node:24-bookworm \
               bash -lc 'npm ci && npm run build' && \
             echo '== Deployed commit ==' && \
             git rev-parse --short HEAD"

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/portfolio_deploy