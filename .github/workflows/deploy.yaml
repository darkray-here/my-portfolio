name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Oracle VPS
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/portfolio_deploy
          chmod 600 ~/.ssh/portfolio_deploy

          ssh-keyscan -H 80.225.213.78 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh \
            -i ~/.ssh/portfolio_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ubuntu@80.225.213.78 \
            'bash -s' <<'REMOTE'
              set -euo pipefail

              cd /opt/homelab/portfolio

              echo "== Sync repository =="
              git fetch origin main
              git reset --hard origin/main

              echo "== Build portfolio =="
              docker run --rm \
                -v /opt/homelab/portfolio:/app \
                -w /app \
                node:24-bookworm \
                bash -lc "npm ci && npm run build"

              echo "== Deployed commit =="
              git rev-parse --short HEAD
            REMOTE

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/portfolio_deploy